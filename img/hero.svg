<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Jack Wong · Developer and AI builder</title>
  <desc id="desc">I build websites, apps and AI assistants that save you time and bring in sales. Based in Malaysia.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070F"/>
      <stop offset="1" stop-color="#0C1230"/>
    </linearGradient>
    <radialGradient id="glowViolet">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".38"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink">
      <stop offset="0" stop-color="#F472B6" stop-opacity=".32"/>
      <stop offset="1" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".35" stop-color="#C4B5FD"/>
      <stop offset=".75" stop-color="#7C3AED" stop-opacity=".55"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".45" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#67E8F9"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0; 1 0; 0 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#22D3EE" stop-opacity=".15"/>
      <stop offset="1" stop-color="#F472B6" stop-opacity=".8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity=".045"/>
    </pattern>
    <linearGradient id="gridFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".25"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".4"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1200" height="460" fill="url(#gridFade)"/></mask>
    <clipPath id="card"><rect width="1200" height="460" rx="28"/></clipPath>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace; }

    .drift-a { animation: drift-a 16s ease-in-out infinite; }
    .drift-b { animation: drift-b 20s ease-in-out infinite; }
    .drift-c { animation: drift-c 18s ease-in-out infinite; }
    @keyframes drift-a { 0%,100% { transform: translate(0,0) } 50% { transform: translate(90px,50px) } }
    @keyframes drift-b { 0%,100% { transform: translate(0,0) } 50% { transform: translate(-110px,-30px) } }
    @keyframes drift-c { 0%,100% { transform: translate(0,0) } 50% { transform: translate(-40px,60px) } }

    .orbit-outer { transform-origin: 930px 230px; animation: spin 48s linear infinite; }
    .orbit-inner { transform-origin: 930px 230px; animation: spin-rev 30s linear infinite; }
    .orbit-outer .chip { animation: spin-rev 48s linear infinite; }
    .orbit-inner .chip { animation: spin 30s linear infinite; }
    .chip { transform-box: fill-box; transform-origin: center; }
    @keyframes spin { to { transform: rotate(360deg) } }
    @keyframes spin-rev { to { transform: rotate(-360deg) } }

    .core { transform-origin: 930px 230px; animation: pulse 3.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: .85 } 50% { transform: scale(1.1); opacity: 1 } }

    .star { animation: twinkle 4s ease-in-out infinite; }
    @keyframes twinkle { 0%,100% { opacity: .12 } 50% { opacity: .9 } }

    .live { transform-box: fill-box; transform-origin: center; animation: live 2s ease-out infinite; }
    @keyframes live { 0% { transform: scale(1); opacity: .7 } 100% { transform: scale(2.6); opacity: 0 } }

    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }

    .rise { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
    .d1 { animation-delay: .1s } .d2 { animation-delay: .3s } .d3 { animation-delay: .5s } .d4 { animation-delay: .7s } .d5 { animation-delay: .9s }
    @keyframes rise { from { opacity: 0; transform: translateY(16px) } to { opacity: 1; transform: none } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .rise { opacity: 1; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="460" fill="url(#bg)"/>

    <!-- aurora -->
    <circle class="drift-a" cx="980" cy="120" r="360" fill="url(#glowViolet)"/>
    <circle class="drift-b" cx="1080" cy="420" r="300" fill="url(#glowCyan)"/>
    <circle class="drift-c" cx="120" cy="520" r="320" fill="url(#glowPink)"/>

    <rect width="1200" height="460" fill="url(#grid)" mask="url(#gridMask)"/>

    <!-- stars -->
    <g fill="#FFFFFF">
      <circle class="star" cx="640" cy="60" r="1.6"/>
      <circle class="star" cx="702" cy="372" r="1.2" style="animation-delay:1.2s"/>
      <circle class="star" cx="1130" cy="70" r="1.8" style="animation-delay:.6s"/>
      <circle class="star" cx="1160" cy="300" r="1.3" style="animation-delay:2.1s"/>
      <circle class="star" cx="560" cy="420" r="1.4" style="animation-delay:2.8s"/>
      <circle class="star" cx="770" cy="110" r="1.1" style="animation-delay:1.7s"/>
      <circle class="star" cx="1050" cy="400" r="1.5" style="animation-delay:3.3s"/>
      <circle class="star" cx="480" cy="40" r="1.2" style="animation-delay:.9s"/>
    </g>

    <!-- left: copy -->
    <g class="rise d1">
      <rect x="72" y="62" width="318" height="34" rx="17" fill="#22C55E" fill-opacity=".1" stroke="#22C55E" stroke-opacity=".45"/>
      <circle class="live" cx="94" cy="79" r="5" fill="#22C55E"/>
      <circle cx="94" cy="79" r="5" fill="#22C55E"/>
      <text class="sans" x="110" y="84.5" font-size="15" font-weight="600" fill="#86EFAC" letter-spacing=".4">Open to freelance &amp; full-time roles</text>
    </g>

    <g class="rise d2">
      <text class="mono" x="72" y="146" font-size="19" fill="#94A3B8"><tspan fill="#A78BFA">&gt;</tspan> developer <tspan fill="#67E8F9">+</tspan> AI builder<tspan class="caret" fill="#E2E8F0"> _</tspan></text>
    </g>

    <g class="rise d3">
      <text class="sans" x="68" y="232" font-size="86" font-weight="800" letter-spacing="-2" fill="url(#nameFill)">Jack Wong</text>
    </g>

    <g class="rise d4">
      <text class="sans" x="72" y="282" font-size="27" fill="#CBD5E1">I build <tspan fill="#FFFFFF" font-weight="700">websites, apps &amp; AI assistants</tspan></text>
      <text class="sans" x="72" y="318" font-size="27" fill="#CBD5E1">that <tspan fill="#FFFFFF" font-weight="700">save you time</tspan> and <tspan fill="#FFFFFF" font-weight="700">bring in sales</tspan>.</text>
    </g>

    <g class="rise d5">
      <g transform="translate(72 352)">
        <rect width="170" height="64" rx="14" fill="#FFFFFF" fill-opacity=".04" stroke="#FFFFFF" stroke-opacity=".1"/>
        <text class="sans" x="16" y="28" font-size="22" font-weight="800" fill="#FFFFFF">24/7</text>
        <text class="sans" x="16" y="50" font-size="15" fill="#94A3B8">AI replies customers</text>
      </g>
      <g transform="translate(256 352)">
        <rect width="170" height="64" rx="14" fill="#FFFFFF" fill-opacity=".04" stroke="#FFFFFF" stroke-opacity=".1"/>
        <text class="sans" x="16" y="28" font-size="22" font-weight="800" fill="#FFFFFF">Weeks</text>
        <text class="sans" x="16" y="50" font-size="15" fill="#94A3B8">not months, to launch</text>
      </g>
      <g transform="translate(440 352)">
        <rect width="190" height="64" rx="14" fill="#FFFFFF" fill-opacity=".04" stroke="#FFFFFF" stroke-opacity=".1"/>
        <text class="sans" x="16" y="28" font-size="22" font-weight="800" fill="#FFFFFF">EN · 中文 · BM</text>
        <text class="sans" x="16" y="50" font-size="15" fill="#94A3B8">we speak your language</text>
      </g>
    </g>

    <!-- right: AI orbit -->
    <circle cx="930" cy="230" r="180" fill="none" stroke="url(#ring)" stroke-width="1.4" stroke-dasharray="2 7" opacity=".8"/>
    <circle cx="930" cy="230" r="88" fill="none" stroke="url(#ring)" stroke-width="1.2" opacity=".55"/>

    <g class="orbit-outer">
      <g class="chip">
        <rect x="1060" y="216" width="100" height="28" rx="14" fill="#0B1024" stroke="#67E8F9" stroke-opacity=".6"/>
        <text class="mono" x="1110" y="235" font-size="13" fill="#E0F2FE" text-anchor="middle">Websites</text>
      </g>
      <g class="chip">
        <rect x="895" y="396" width="70" height="28" rx="14" fill="#0B1024" stroke="#A78BFA" stroke-opacity=".6"/>
        <text class="mono" x="930" y="415" font-size="13" fill="#EDE9FE" text-anchor="middle">Apps</text>
      </g>
      <g class="chip">
        <rect x="700" y="216" width="100" height="28" rx="14" fill="#0B1024" stroke="#F472B6" stroke-opacity=".6"/>
        <text class="mono" x="750" y="235" font-size="13" fill="#FCE7F3" text-anchor="middle">Chatbots</text>
      </g>
      <g class="chip">
        <rect x="875" y="36" width="110" height="28" rx="14" fill="#0B1024" stroke="#67E8F9" stroke-opacity=".6"/>
        <text class="mono" x="930" y="55" font-size="13" fill="#E0F2FE" text-anchor="middle">Automation</text>
      </g>
    </g>

    <g class="orbit-inner">
      <g class="chip">
        <rect x="972" y="173" width="68" height="26" rx="13" fill="#140B2E" stroke="#C4B5FD" stroke-opacity=".8"/>
        <text class="mono" x="1006" y="191" font-size="12.5" fill="#F5F3FF" text-anchor="middle">Sales</text>
      </g>
      <g class="chip">
        <rect x="814" y="173" width="80" height="26" rx="13" fill="#140B2E" stroke="#C4B5FD" stroke-opacity=".8"/>
        <text class="mono" x="854" y="191" font-size="12.5" fill="#F5F3FF" text-anchor="middle">Support</text>
      </g>
      <g class="chip">
        <rect x="890" y="305" width="80" height="26" rx="13" fill="#140B2E" stroke="#C4B5FD" stroke-opacity=".8"/>
        <text class="mono" x="930" y="323" font-size="12.5" fill="#F5F3FF" text-anchor="middle">Reports</text>
      </g>
    </g>

    <g class="core">
      <circle cx="930" cy="230" r="70" fill="url(#core)" opacity=".9"/>
      <circle cx="930" cy="230" r="34" fill="#0B0820" stroke="#E9D5FF" stroke-opacity=".9" stroke-width="1.5"/>
      <text class="sans" x="930" y="240" font-size="27" font-weight="800" fill="#FFFFFF" text-anchor="middle" filter="url(#soft)">AI</text>
    </g>

    <text class="mono" x="1128" y="436" font-size="14" fill="#64748B" text-anchor="end">Malaysia</text>

    <rect x=".5" y=".5" width="1199" height="459" rx="27.5" fill="none" stroke="#FFFFFF" stroke-opacity=".09"/>
  </g>
</svg>
